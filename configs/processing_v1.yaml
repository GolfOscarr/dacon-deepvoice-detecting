# The data-processing pipeline's v1 draw -- docs/processing/03 §5, loaded by
# `processing.config.load_processing_config`. Independent of the training
# run configs (configs/run_*.yaml): this is what `processing.sampler.Sampler`
# draws, and nothing else reads it.
#
# Every field is written out even where it equals the default, so the ledger
# row is this file and not whatever the code defaulted to that week. Values
# marked OPEN are docs/processing/03 §8's -- placeholders, decided by the
# measurement named there, never silently.

draw:
  # D-2. The reference mix, verified against C1 and C3. OPEN: sweep vs the
  # minimax mix {.03 .03 .03 .03 .323 .10 .10 .197 .16} on per-head VAL EER.
  cell_mix:
    p: {1: 0.060, 2: 0.130, 3: 0.060, 4: 0.135, 5: 0.155,
        6: 0.125, 7: 0.125, 8: 0.095, 9: 0.115}
  # D-1. Strict: every mixed sample composed. Only f8 = 1 balances composedness
  # on the component heads (02 §4.2). Whole-file rows exist for the sweep only.
  f8: 1.0
  # D-16. DOSS cap as a sampling weight, on component AND whole-file rows.
  domain_cap: 500
  # DRAW-1. The competition's own range; drawn first.
  duration_range: [4.0, 60.0]
  # D-3 / D-21. ONE take per sample, shared by every role and row kind,
  # strictly inside the file by edge_margin_s at both ends, tiled to its
  # span with independent offsets per tile. take_range_s[1] must not exceed
  # component_floor_s - 2 * edge_margin_s (asserted): no file ever caps the
  # take, so the join count is a function of (span, take) only.
  take_range_s: [1.5, 2.5]
  edge_margin_s: 0.5
  # D-5 (revised). OPEN with the take: floor 3.0 / take [1.5, 2.0] keeps 92 %
  # of pool B's hours, 4.0 / [2, 3] keeps 80 %, 6.0 / [3, 5] keeps 63 %.
  component_floor_s: 2.5
  # DRAW-4. The voice/music level ratio, skewed quiet (A-A3).
  gain_db_range: [-15.0, 15.0]
  gain_db_mean: -3.6
  gain_db_sigma: 4.0
  sequential_prob: 0.25
  # The taper at every join: the sequential joint and every tile joint.
  crossfade_ms_range: [10.0, 200.0]
  # D-6. lead ~ U(0, 3.0) on every sample (0.595 -> 0.553); tail OPEN,
  # unmeasured -- next harness run with tail in the grid.
  silence_lead_s: 3.0
  silence_tail_s: 1.0
  # DRAW-5. With p_noise_layer a pool-E row goes under the composite of ANY
  # cell at U(10, 30) dB SNR, tiled like a component and scaled at render.
  # Rows flagged noise_has_speech (D-14) never go under a voice_present = 0
  # cell. The decision and the SNR are drawn before the cell.
  p_noise_layer: 0.5
  noise_snr_db_range: [10.0, 30.0]
  # DRAW-6. name, per-sample p, parameter ranges; drawn before the cell into
  # spec.transforms. A `<k>_range` the augment accepts as scalar `<k>` is
  # drawn at spec time (I1b sees the value); the others are drawn inside the
  # augment from spec.rng. `rir` (A-A10): RIRS' 218 real responses (the
  # `_rir_` files beside the isotropic noises), direct path aligned to 0,
  # dry/wet U(0.3, 1.0), level preserved.
  augments:
    - {name: gain_jitter,      p: 1.0, db_range: [-12.0, 12.0]}        # D-8
    - {name: rawboost_ssi,     p: 0.5, snr_db_range: [10.0, 40.0], tilt_db_range: [-12.0, 12.0]}
    - {name: gaussian_noise,   p: 0.3, snr_db_range: [10.0, 30.0]}
    - {name: pink_noise,       p: 0.3, snr_db_range: [10.0, 30.0]}
    - {name: stereo_imbalance, p: 0.3, db_range: [-4.0, 4.0]}
    - {name: rir, p: 0.2, wet_range: [0.3, 1.0], max_rir_s: 1.0, pattern: "*_rir_*.wav",
       bank_dir: /data/project/private/dacon-corpus/interim/rirs-noises/openslr-28/RIRS_NOISES/real_rirs_isotropic_noises}
  # DRAW-7 / D-13. One menu for every cell, drawn per sample into
  # spec.normalize: container (+ bitrate for mp3), channels, and the 8 kHz
  # telephone leg with mu-law / A-law / no companding ("plain").
  normalize_menu:
    container: {wav: 0.30, flac: 0.15, mp3_64: 0.15, mp3_96: 0.15, mp3_128: 0.15, mp3_192: 0.10}
    channels:  {mono: 0.5, stereo: 0.5}
    telephone: {none: 0.80, ulaw: 0.10, alaw: 0.05, plain: 0.05}
    telephone_hz: 8000
  scheme_version: strategy-v2
  # Leave false: it exists for the audit's own mutation tests.
  allow_unsound_mix: false

render:
  # Manifest paths are relative to this: the corpus root. The built manifest
  # (scripts/build_corpus_manifest.py -> manifests/strategy-v1/) writes paths
  # with their stage directory (interim/..., raw/... for mlaad), so one root
  # resolves every source. The EDA's S-tier manifest (eda/out/_strategy/) is
  # relative to <root>/interim instead.
  root: /data/project/private/dacon-corpus
  audio:
    sample_rate: 16000
    min_seconds: 4.0
    max_seconds: 60.0
    # Caveat: `channels` and `band_hz` are the SHIPPED chain's (SHIP-3, SHIP-5)
    # and are not applied by the renderer; band_hz is set when that stage
    # lands (docs/processing/03 §6 step 5), not before.
    channels: downmix
    band_hz: null
  # A callable, so YAML carries its NAME and `training.config.RESAMPLERS`
  # resolves it (A-S1).
  resampler: training.render.resample_poly_to
  # sigmoid beats a hard cut, which becomes a splice shortcut (A-A4).
  crossfade_shape: sigmoid
  # I12, the length-regime guard.
  check_duration: true
  # OFF-6. Set: every component is a slice of its cached 16 kHz int16 decode
  # (scripts/build_cache.py), and a file missing from the cache is an error --
  # one decode regime per run. null: decode from the corpus.
  cache_root: /data/project/private/dacon-corpus/cache16k

ship:
  # The shipped chain (`processing.ship.ship`): what happens between the
  # decoded waveform and the model, identically in training and in
  # submit.zip, per file over its valid prefix (I14). One function, one
  # call site.
  sample_rate: 16000
  # SHIP-3. downmix | left | mid_side.
  channels: downmix
  # SHIP-4 / D-10. DC is a generator id that inverts across archives.
  preprocess: [dc_offset]
  # SHIP-5. D-11: no high-pass (low edge 0). D-12, OPEN: 7200 Hz upper edge
  # vs the resampler shelf and SONICS' 7.3 kHz rolloff -- ablate vs null.
  band_hz: [0.0, 7200.0]

folds:
  # OFF-5, `training.folds.FoldConfig`. D-22: FOUR folds. The music head has
  # five composable fake families (FakeMusicCaps) plus SONICS' two whole-file
  # only ones; PROBE seals one, and five VAL sides need five composable --
  # four is what the corpus supports. Each VAL fold validates the music head
  # on 1-2 families (the variance caveat in folds.caveats.txt). OPEN: five
  # folds with allow_no_probe, or a sixth fake-music family.
  n_folds: 4
  probe_share: 0.10
  scheme_version: null
  caveat_families_per_val_fold: 2
  require_component_coverage: true
  allow_no_probe: false
  assigned_at: null
  # 06 D1: the PROBE row budget counts drawable rows only, and PROBE's real
  # side gets a floor in hours and atoms per role. 06 D4: folds balance the
  # drawable hours of every (role, fake) pair, and a thin VAL side is a caveat.
  probe_budget_drawable_only: true
  probe_min_real_hours: 5.0
  probe_min_real_atoms: 5
  balance_on: hours
  caveat_min_role_hours: 5.0
