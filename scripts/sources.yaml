# Acquisition registry -- the declarative half of scripts/fetch_to_s3.py.
#
# Critical: `redistribution` is the G2 gate (docs/data/10 section 5) expressed as
# data. The fetcher refuses any source whose verdict is not `ok`, so adding a
# download URL is not by itself enough to acquire something -- somebody has to
# record a licence verdict first. That ordering is the whole point: DACON
# requires shipping the actual training files (#417280), so a source we cannot
# redistribute is a source we cannot train on, and finding that out after the
# download means rebuilding the corpus.
#
# Fields per source:
#   name          directory name under the raw prefix, and `source_name` in the
#                 provenance ledger. Critical: this is the coarse key only --
#                 the per-file ledger still needs track/speaker granularity,
#                 which cannot be retrofitted (docs/data/08).
#   version       immutable release identifier. Part of the S3 path, so a new
#                 release lands beside the old one rather than overwriting it.
#   pool          A-E per docs/data/02, or `mixed` when one archive spans pools.
#   status        ready | needs_terms | needs_request | needs_review | blocked
#   redistribution  ok | review | no    <- the gate the fetcher enforces
#   verified_at_origin  whether somebody read the licence on the dataset's own
#                 page. Reported-from-a-secondary-source is not verification;
#                 docs/data/11 says every row starts unverified.
#   fetch.kind    http | mdc | hf | kaggle
#
# Caveat: `bytes` is what the server advertised on the date below. It is a
# planning figure for disk and cost, not a checksum -- the fetcher records the
# real sha256 of what it actually received.

schema_version: 1
compiled: "2026-09-08"

