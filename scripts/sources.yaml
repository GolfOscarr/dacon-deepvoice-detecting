  - name: musdb18-hq
    version: zenodo-3338373
    pool: mixed
    status: ready
    redistribution: ok
    licence: >-
      "educational purposes only", non-commercial, and FOUR different upstream
      licences in one archive
    licence_url: https://zenodo.org/records/3338373
    verified_at_origin: true
    verified_date: "2026-09-08"
    verified_note: >-
      Read from the Zenodo record itself. Zenodo tags it `other-nc`, and the
      description breaks the 150 tracks down as: 100 from DSD100 (itself derived
      from the 'Mixing Secrets' Free Multitrack Download Library, with rights
      questions deferred to that original resource), 46 from MedleyDB under
      CC BY-NC-SA 4.0, 2 supplied by Native Instruments with no licence stated,
      and 2 from The Easton Ellises under CC BY-NC-SA 3.0.
    verdict_reasoning: >-
      Cleared against the rule text rather than against the shape of the
      licence, which is what an earlier reading of this row got wrong.
      #417280 answer 1 opens with the sentence that decides it: "운영진 검증
      목적의 제출은 일반적인 공개 혹은 재배포와는 구분됩니다" -- submitting to
      DACON for verification is NOT redistribution. The single bar it then sets
      is data "라이선스상 제3자 제공 자체가 제한되는" -- where the licence
      restricts third-party provision *itself*.
      MUSDB18-HQ does not. It carries no anti-redistribution clause; it is
      served anonymously to anyone, DACON included; what it restricts is
      *commercial use*, which is a different thing. And #417212 settles that
      shape directly: CC-BY-NC and even CC-BY-NC-SA are usable when the licence
      terms are complied with. #417310 adds that external public data keeps its
      own licence and is not swallowed by the winning-work exclusivity clause.
      The four-way upstream split is therefore a compliance duty, not a bar --
      the two components with no stated licence are published by the dataset's
      own authors as part of a public corpus, and nothing in them restricts
      provision.
    caveat_compliance: >-
      Critical: #417212's answer turns on "해당 라이선스 조건을 준수하는 경우",
      so the non-commercial and attribution terms are ours to honour. Cite
      MUSDB18-HQ in the 2nd-stage 데이터 구성 보고서, and keep it out of
      anything sold. Note also that 46 of the tracks are MedleyDB under
      CC-BY-NC-**SA**: docs/competition/05 flags SA propagation into the model
      deliverable as a genuine tension, so prefer these tracks as *training
      input* rather than shipping derived stems.
    why: >-
      150 tracks with isolated stems -- the keystone for building the 4-way
      voice x music grid ourselves rather than hoping to find it.
    caveat: >-
      If the verdict goes against us, the fallback for isolated stems is
      MedleyDB directly (CC BY-NC-SA 4.0, and already the source of 46 of these
      tracks), MoisesDB, or Slakh2100 -- which is synthesised from MIDI and so
      has the cleanest provenance of the three.
    fetch:
      kind: http
      urls:
        - https://zenodo.org/records/3338373/files/musdb18hq.zip?download=1
      bytes: 22656664047

