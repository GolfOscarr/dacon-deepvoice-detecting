    terms_accepted: "2026-09-08"   # HF gate cleared; resolve returns HTTP 200
    why: >-
      175 TTS models, 1002.9 h, 54 languages. Generalisation to unseen
      generators is the binding constraint and nothing else comes close.
    caveat: >-
      Critical: capped, not taken whole. The repo holds 534,539 files (~174 GB,
      1002.9 h) and docs/data/04 budgets 30 h from it. An uncapped pull measured
      at ~32 h of wall clock for 33x the audio the plan asks for -- and DOSS says
      a domain-balanced 0.2k h beats a naive 6.4k h, so it is also the worse
      corpus. cap_per_dir caps the LEAF directory, which in MLAAD's
      fake/<language>/<generator>/ layout is the generator: all 175 families are
      kept, none is taken whole. Selection is seeded and written to
      _meta/selection.json so the subset is reproducible.
      Caveat: the HF API's `siblings` field reports 99,411 for this repo -- a 5x
      undercount. list_repo_files is the number that matches reality.
